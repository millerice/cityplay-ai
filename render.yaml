services:
  - type: web
    name: cityplay-ai
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Optional: visitors can instead paste their own Qloo key in-app (top-left
      # "API keys"). Set this only to give judges a zero-config demo.
      - key: QLOO_API_KEY
        sync: false # Hackathon credential; set it in Render's dashboard, never commit it.
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: CITYPLAY_QLOO_HOURLY_BUDGET
        value: "120"
    # Both QLOO_API_KEY and DEEPSEEK_API_KEY are optional server-side: the app
    # lets each visitor bring their own keys, kept in memory only. PUBLIC_ORIGIN
    # is auto-derived from RENDER_EXTERNAL_URL at boot.
